[package]
name = "harness-bridge"
version = "0.5.1"
edition = "2021"
description = "Browse, preview and migrate coding sessions between harnesses, with a terminal workbench and optional local browser UI"
license = "MIT"
repository = "https://github.com/ahnafnafee/harness-bridge"
keywords = ["codex", "claude-code", "sessions", "migration", "agent"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
web-ui = ["dep:tiny_http", "dep:getrandom"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
ruzstd = "0.8"
zstd = "0.13"
sha2 = "0.10"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }
tiny_http = { version = "0.12", optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
strip = true
