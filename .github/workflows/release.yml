name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and verify without creating a release
        required: true
        default: v0.5.0

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --features web-ui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="harness-bridge-${VERSION}-${TARGET}"
          dir="$name"
          mkdir -p "$dir"
          bin="target/$TARGET/release/harness-bridge"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="$bin.exe"; fi
          cp "$bin" "$dir/"
          cp README.md LICENSE AGENTS.md "$dir/"
          cp -R docs "$dir/"
          cp -R assets "$dir/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$dir' -DestinationPath '$name.zip' -Force"
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$dir"
            asset="$name.tar.gz"
          fi
          # macOS has no sha256sum; shasum -a 256 produces the same format
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "checksums-$TARGET.txt"
          else
            shasum -a 256 "$asset" > "checksums-$TARGET.txt"
          fi

      - name: Verify packaged executable and local interface
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: python scripts/verify_release.py "harness-bridge-${VERSION}-${TARGET}.${ARCHIVE}" --version "${VERSION#v}" --checksums "checksums-$TARGET.txt" --smoke

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            harness-bridge-*.zip
            harness-bridge-*.tar.gz
            checksums-*.txt
          if-no-files-found: error

  release:
    name: prepare release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums and write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat dist/checksums-*.txt | sort -k2 > sha256sums.txt
          (cd dist && sha256sum -c ../sha256sums.txt)
          rm dist/checksums-*.txt
          release_template=$(cat docs/releases/template.md)
          printf '%s\n\n' "${release_template//__VERSION__/$VERSION}" > NOTES.md
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            cat "docs/releases/$VERSION.md" >> NOTES.md
            echo >> NOTES.md
          fi

      - name: Prepare GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          draft: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/harness-bridge-*.zip
            dist/harness-bridge-*.tar.gz
            sha256sums.txt
