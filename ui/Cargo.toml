[package]
name = "harness-bridge-ui"
version = "0.5.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = "=0.9.0"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location", "History", "Request", "RequestInit", "Response", "Headers", "Navigator", "Clipboard"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[workspace]
