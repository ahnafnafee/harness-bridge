[package]
name = "harness-bridge"
version = "0.2.1"
edition = "2021"
description = "Migrate coding-agent sessions between harnesses: DeepSeek Harness (dsh), Codex Desktop, Claude Code, ZCode, agy"
license = "MIT"
repository = "https://github.com/ahnafnafee/harness-bridge"
keywords = ["codex", "claude-code", "sessions", "migration", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
ruzstd = "0.8"
sha2 = "0.10"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
strip = true
